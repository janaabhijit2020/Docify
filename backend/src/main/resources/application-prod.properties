# =========================================================
# DOCIFY PRODUCTION CONFIGURATION
# =========================================================

spring.application.name=docify-backend


# =========================================================
# DATABASE - SUPABASE
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# =========================================================
# SERVER
# =========================================================

server.port=${SERVER_PORT:8080}


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# =========================================================
# FILE STORAGE
# =========================================================

file.storage.documents=storage/documents
app.storage.mode=supabase


# =========================================================
# SUPABASE STORAGE
# =========================================================

supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:docify-documents}


# =========================================================
# GOOGLE GEMINI
# =========================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.dimensions=768


# =========================================================
# PGVECTOR
# =========================================================

spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.table-name=vector_store


# =========================================================
# MULTIPART UPLOAD LIMITS
# =========================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB